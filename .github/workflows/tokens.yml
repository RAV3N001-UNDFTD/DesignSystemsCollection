name: ci

on:
  push:
    paths:
      - 'tokens/**'
      - 'registry/**'
      - 'scripts/**'
      - 'dist/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/tokens.yml'
  pull_request:
    paths:
      - 'tokens/**'
      - 'registry/**'
      - 'scripts/**'
      - 'dist/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/tokens.yml'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure committed dist is in sync with sources
        run: git diff --exit-code dist
